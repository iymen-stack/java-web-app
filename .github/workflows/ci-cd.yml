name: Java CI and GHCR Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Compile and test Java app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Java application
        run: javac --add-modules jdk.httpserver App.java

      - name: Smoke test application
        shell: bash
        run: |
          set -euo pipefail

          java --add-modules jdk.httpserver App &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          READY=false

          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8082/ \
              -o response.html 2>/dev/null; then
              READY=true
              break
            fi
            sleep 1
          done

          if [ "$READY" != "true" ]; then
            echo "Application failed to start on port 8082"
            exit 1
          fi

          echo "Checking website HTML..."
          grep -Fq "<title>Java Docker Website</title>" response.html
          grep -Fq "<h1>Hello from Java and Docker!</h1>" response.html

          echo "Checking health endpoint..."
          HEALTH=$(curl -fsS http://127.0.0.1:8082/health)
          test "$HEALTH" = "UP"

          echo "Checking unknown endpoint..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://127.0.0.1:8082/unknown)
          test "$STATUS" = "404"

          echo "All application tests passed."

  publish:
    name: Build and publish Docker image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" \
            >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}